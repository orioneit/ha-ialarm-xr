name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/ialarm_xr/manifest.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "manifest version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md

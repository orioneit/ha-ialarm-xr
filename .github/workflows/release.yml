name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/ialarm_xr/manifest.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "manifest version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Novità / What's new
            - Nuovo sensore **contatto aperto/chiuso** per ogni zona (richiede *Controllo Magneti* attivo nell'app iAlarm).
            - New per-zone **contact open/closed** sensor (requires *Magnet check* enabled in the iAlarm app).
            - Attributo `zone_status_raw` con lo stato grezzo della zona / raw zone status attribute.
